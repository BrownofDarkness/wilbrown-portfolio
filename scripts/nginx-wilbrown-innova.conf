# ─────────────────────────────────────────────────────────────────────
# nginx config for wilbrown-innova.com
# HTTP-only — SSL is terminated at Cloudflare edge, traffic reaches
# this nginx via Cloudflare Tunnel. No Let's Encrypt needed.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name wilbrown-innova.com www.wilbrown-innova.com;

    # Matches Next.js serverActions.bodySizeLimit (200mb) for multi-photo
    # admin uploads. nginx default of 1MB would reject them before they
    # ever reach Next.js.
    client_max_body_size 200M;

    # Longer timeouts so big uploads don't get killed mid-stream.
    proxy_read_timeout    300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;

    # User-uploaded content (admin uploads). Served directly by nginx from
    # disk — bypasses Next.js entirely. This is required because Next.js
    # production doesn't re-scan public/ at runtime: files added after
    # `next build` (i.e. all admin uploads) fall through to the 404 page.
    # nginx serves them with proper Cache-Control and zero Node.js overhead.
    # Use `root` (not `alias`): with alias + try_files, $uri ends up
    # duplicating the location prefix and always 404s. `root` simply
    # prepends the path to the URI, so /events/uploads/foo.webp resolves
    # to /var/www/wilbrown-portfolio/public/events/uploads/foo.webp.
    location /events/uploads/ {
        root /var/www/wilbrown-portfolio/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /showcase/uploads/ {
        root /var/www/wilbrown-portfolio/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Tell Next.js the original request was HTTPS (terminated at
        # Cloudflare edge). Without this, Secure cookies and redirect
        # URLs will be wrong.
        proxy_set_header X-Forwarded-Proto  https;
        proxy_cache_bypass $http_upgrade;
    }
}
