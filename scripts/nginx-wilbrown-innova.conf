# ─────────────────────────────────────────────────────────────────────
# nginx config for wilbrown-innova.com
# HTTP-only — SSL is terminated at Cloudflare edge, traffic reaches
# this nginx via Cloudflare Tunnel. No Let's Encrypt needed.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name wilbrown-innova.com www.wilbrown-innova.com;

    # Matches Next.js serverActions.bodySizeLimit (200mb) for multi-photo
    # admin uploads. nginx default of 1MB would reject them before they
    # ever reach Next.js.
    client_max_body_size 200M;

    # Longer timeouts so big uploads don't get killed mid-stream.
    proxy_read_timeout    300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        # Tell Next.js the original request was HTTPS (terminated at
        # Cloudflare edge). Without this, Secure cookies and redirect
        # URLs will be wrong.
        proxy_set_header X-Forwarded-Proto  https;
        proxy_cache_bypass $http_upgrade;
    }
}
