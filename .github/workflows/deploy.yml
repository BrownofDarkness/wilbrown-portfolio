name: Deploy to VPS

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab too
  workflow_dispatch:

# Only one deploy at a time — cancel any in-progress run if a newer push lands
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Join the user's Tailscale network as an ephemeral node.
      # The VPS is only reachable via Tailscale (no public SSH), so this
      # step is required BEFORE SSH. Ephemeral = the temp node auto-
      # deregisters when the runner exits.
      - name: Tailscale connect
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          # 'tags' is required when authenticating via OAuth client.
          # Must match a tag that the OAuth client is authorized to
          # mint keys for (configured in Tailscale ACL tagOwners).
          tags: tag:ci

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          # VPS_HOST = Tailscale MagicDNS name or 100.x.x.x IP
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_REPO_PATH || '/var/www/wilbrown-portfolio' }}

            echo "▶ Fetching latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "▶ npm install"
            npm install --no-audit --no-fund

            echo "▶ Building production bundle"
            npm run build

            echo "▶ Reloading PM2 (graceful)"
            pm2 reload portfolio --update-env

            echo "✓ Deploy complete — $(git rev-parse --short HEAD)"
            pm2 list | grep portfolio || true
