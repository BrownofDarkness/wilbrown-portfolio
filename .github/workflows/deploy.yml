name: Deploy to EC2

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab too
  workflow_dispatch:

# Only one deploy at a time — cancel any in-progress run if a newer push lands
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          # VPS_HOST = EC2 public IP (attach an Elastic IP to keep it stable)
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_REPO_PATH || '/var/www/wilbrown-portfolio' }}

            echo "▶ Fetching latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "▶ npm install"
            npm install --no-audit --no-fund

            echo "▶ Building production bundle"
            npm run build

            echo "▶ Reloading PM2 (graceful)"
            pm2 reload portfolio --update-env

            echo "✓ Deploy complete — $(git rev-parse --short HEAD)"
            pm2 list | grep portfolio || true
